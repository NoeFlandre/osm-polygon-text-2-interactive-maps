[project]
name = "osm-landuse-map"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "huggingface-hub>=2.2.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "hypothesis>=6.168.5",
    "mkdocs-material>=9.7.7",
    "mutmut>=3.8.0",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "radon>=6.0.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[project.scripts]
landuse-map = "landuse_map.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["landuse_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs Hugging Face access to the real dataset",
    "e2e: opens the page in a browser",
]

[tool.coverage.run]
source = ["landuse_map"]

[tool.coverage.report]
show_missing = true

[tool.mutmut]
paths_to_mutate = ["landuse_map/"]
tests_dir = ["tests/"]
pytest_add_cli_args_test_selection = ["-m", "not e2e and not network"]

[tool.ruff]
extend-exclude = ["mutants"]

[tool.ty.src]
exclude = ["mutants"]
