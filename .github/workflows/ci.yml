name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Install browser for the hover tests
        run: uv run playwright install --with-deps chromium
      - name: Tests with coverage
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report
          uv run coverage json -o coverage.json
      - name: CRAP score must be below 6
        run: uv run python scripts/crap.py coverage.json --below 6
      - name: Build docs
        run: uv run mkdocs build --strict

  mutation:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Run mutation tests
        run: uv run mutmut run
      - name: Export stats
        run: uv run mutmut export-cicd-stats
      - name: Mutation score gate
        run: uv run python scripts/mutation_gate.py --min 80

  deploy:
    # Building every area takes a long time, so this runs by hand only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 240
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Build the site for every area
        run: uv run landuse-map site site-out
      - name: Upload to the Hugging Face Space
        if: env.HF_TOKEN != ''
        run: uv run python scripts/deploy_space.py site-out
      - name: Explain a missing token
        if: env.HF_TOKEN == ''
        run: echo "HF_TOKEN is not set. The site was built but not uploaded."
