<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land-use map</title>
<link rel="stylesheet" href="__LEAFLET_CSS__" integrity="__LEAFLET_CSS_SRI__" crossorigin="">
<style>
html, body { margin: 0; height: 100%; }
#map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
.leaflet-tooltip {
  white-space: normal !important; width: max-content; max-width: 320px;
  opacity: 1 !important; padding: 8px 10px; border: none; border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
  font: 13px/1.4 system-ui, sans-serif; color: #0f172a;
}
.leaflet-tooltip::before { display: none; }
.lu + .lu { margin-top: 8px; }
.panel, .legend {
  position: absolute; z-index: 1000; background: #fff; border-radius: 10px;
  padding: 10px 14px; box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
  font: 13px/1.4 system-ui, sans-serif; color: #0f172a;
}
.panel { top: 12px; left: 56px; width: 270px; }
.panel .stats { display: flex; justify-content: space-between; margin: 8px 0; }
.panel .stats b { font-size: 16px; }
.panel .status { color: #475569; }
.panel label { display: block; margin-top: 6px; }
.panel input[type=range] { width: 100%; margin: 4px 0 0; }
.legend { bottom: 36px; right: 12px; }
.legend-title { font-weight: 600; margin-bottom: 4px; }
.legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.legend .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="status" id="status" hidden></div>
  <div class="stats">
    <div><b id="stat-polygons">0</b> polygons</div>
    <div><b id="stat-yes">0</b> yes labels</div>
    <div><b id="stat-no">0</b> no labels</div>
  </div>
  <label for="min-area">Smallest area shown: <b id="min-area-label">0 m²</b></label>
  <input id="min-area" type="range" min="0" max="1000" step="1" value="0">
</div>
__LEGEND__
<script src="__LEAFLET_JS__" integrity="__LEAFLET_JS_SRI__" crossorigin=""></script>
<script>const DATA = __DATA__;</script>
<script>
(function () {
  const map = L.map("map");
  L.tileLayer(DATA.basemap.url, {
    maxZoom: 20, maxNativeZoom: 19, attribution: DATA.basemap.attribution,
  }).addTo(map);
  map.setView([20, 0], 2);
  const layer = L.layerGroup().addTo(map);
  const highlight = L.polygon([], { interactive: false, weight: 3, fillOpacity: 0.75 });
  // Hover is found here. Many polygons are smaller than a pixel, so a point
  // near a unit's hit point, or inside its outline, counts as hover.
  const tip = L.tooltip({ direction: "top", offset: [0, -8] });
  const status = document.getElementById("status");
  const slider = document.getElementById("min-area");
  const label = document.getElementById("min-area-label");
  const count = (n) => n.toLocaleString("en-US");

  let units = [];
  let shown = [];
  let maxArea = 1;
  let hovered = null;
  let pointer = null;
  let frame = 0;

  const thresholdFor = (value) => (Number(value) <= 0
    ? 0 : Math.pow(maxArea, Number(value) / Number(slider.max)));
  const showArea = (m2) => (m2 < 10 ? m2.toFixed(1) : count(Math.round(m2))) + " m²";

  // Add or remove only the units whose state changed.
  const applyFilter = () => {
    const threshold = thresholdFor(slider.value);
    label.textContent = showArea(threshold);
    shown = [];
    let yes = 0, no = 0;
    for (const u of units) {
      const want = u.area >= threshold;
      if (want !== u.shown) {
        if (want) { layer.addLayer(u.polygon); } else { layer.removeLayer(u.polygon); }
        u.shown = want;
      }
      if (want) { shown.push(u); yes += u.yes; no += u.no; }
    }
    setHovered(null);
    document.getElementById("stat-polygons").textContent = count(shown.length);
    document.getElementById("stat-yes").textContent = count(yes);
    document.getElementById("stat-no").textContent = count(no);
    return { polygons: shown.length, yes, no, threshold };
  };

  // GeoJSON lists [lng, lat] pairs. Leaflet wants [lat, lng].
  const flip = (ring) => ring.map(([lng, lat]) => [lat, lng]);
  const latLngsOf = (geometry) => (geometry.type === "Polygon"
    ? geometry.coordinates.map(flip)
    : geometry.coordinates.map((polygon) => polygon.map(flip)));
  const ringsOf = (geometry) => (geometry.type === "Polygon"
    ? geometry.coordinates : geometry.coordinates.flat()).map(flip);

  // Bounding box as [south, west, north, east].
  const boxOf = (rings) => {
    const box = [90, 180, -90, -180];
    for (const ring of rings) {
      for (const [lat, lng] of ring) {
        box[0] = Math.min(box[0], lat); box[1] = Math.min(box[1], lng);
        box[2] = Math.max(box[2], lat); box[3] = Math.max(box[3], lng);
      }
    }
    return box;
  };

  // Even-odd rule over all rings, so holes count as outside.
  const insideRings = (rings, lat, lng) => {
    let inside = false;
    for (const ring of rings) {
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [yi, xi] = ring[i];
        const [yj, xj] = ring[j];
        if ((yi > lat) !== (yj > lat) && lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) {
          inside = !inside;
        }
      }
    }
    return inside;
  };

  // The unit under a point. A point within DATA.hit.radius pixels of a unit's hit point
  // counts, and so does a point inside its polygon. The smallest unit wins.
  const unitAt = (lat, lng) => {
    const bounds = map.getBounds();
    const tol = DATA.hit.radius * (bounds.getEast() - bounds.getWest()) / map.getSize().x;
    let best = null;
    for (const u of shown) {
      const near = Math.abs(u.hit[0] - lat) <= tol && Math.abs(u.hit[1] - lng) <= tol;
      const inBox = lat >= u.box[0] && lat <= u.box[2] && lng >= u.box[1] && lng <= u.box[3];
      if ((near || (inBox && insideRings(u.rings, lat, lng)))
          && (!best || u.area < best.area)) {
        best = u;
      }
    }
    return best;
  };

  const setHovered = (u) => {
    if (u === hovered) { return; }
    hovered = u;
    if (u) {
      highlight.setStyle({ color: u.color, fillColor: u.color })
        .setLatLngs(u.latlngs).addTo(map);
      tip.setLatLng(pointer).setContent(u.tip).addTo(map);
    } else {
      highlight.remove();
      tip.remove();
    }
  };

  const update = () => {
    frame = 0;
    if (!pointer) { setHovered(null); return; }
    const found = unitAt(pointer.lat, pointer.lng);
    setHovered(found);
    if (found) { tip.setLatLng(pointer); }
  };
  const schedule = () => { if (!frame) { frame = requestAnimationFrame(update); } };
  map.on("mousemove", (e) => { pointer = e.latlng; schedule(); });
  // mouseleave fires only when the pointer leaves the map. mouseout also fires
  // on every move between child elements.
  map.getContainer().addEventListener("mouseleave", () => { pointer = null; schedule(); });

  const makeUnit = (place) => {
    const rings = ringsOf(place.polygon);
    const latlngs = latLngsOf(place.polygon);
    return {
      polygon: L.polygon(latlngs, {
        fillColor: place.color, color: place.color, weight: 1, fillOpacity: 0.5, interactive: false,
      }),
      latlngs, rings, box: boxOf(rings), hit: place.hit, tip: place.tip, color: place.color,
      area: place.area, yes: place.yes, no: place.no, shown: false,
    };
  };

  // payload: { areas: [...] }. Each area has name, bounds and places.
  const draw = (payload) => {
    units = [];
    const bounds = [];
    for (const area of payload.areas) {
      if (area.bounds) { bounds.push(area.bounds); }
      for (const place of area.places) { units.push(makeUnit(place)); }
    }
    maxArea = units.reduce((m, u) => Math.max(m, u.area), 1);
    if (bounds.length) {
      map.fitBounds([
        [Math.min(...bounds.map((b) => b[0][0])), Math.min(...bounds.map((b) => b[0][1]))],
        [Math.max(...bounds.map((b) => b[1][0])), Math.max(...bounds.map((b) => b[1][1]))],
      ], { animate: false });
    }
    applyFilter();
  };

  // The map file is gzip. Decompress it while it downloads.
  const load = (url) => fetch(url).then((response) => {
    if (!response.ok) { throw new Error(String(response.status)); }
    return new Response(response.body.pipeThrough(new DecompressionStream("gzip"))).json();
  });

  slider.addEventListener("input", applyFilter);

  if (DATA.areas) {
    draw({ areas: DATA.areas });
  } else {
    load(DATA.source)
      .then(draw)
      .catch(() => {
        status.hidden = false;
        status.textContent = "Could not load the map data.";
      });
  }
  window.landuseApp = { map, layer, slider, thresholdFor, applyFilter, units: () => units };
})();
</script>
</body>
</html>
